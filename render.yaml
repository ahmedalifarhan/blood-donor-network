# Render Blueprint for the Blood Donor Network API (research R12, BUSINESS_RULES D11).
# Keep this the ONLY free service in its Render workspace: 24 h × 31 days = 744 of
# the 750 free instance hours, and the every-minute cron keeps it awake.
services:
  - type: web
    name: blood-donor-network-api
    runtime: docker
    plan: free
    # Closest Render region to Egypt.
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Laravel's built-in, unthrottled health route. Never the rate-limited /api/v1/health.
    healthCheckPath: /up
    envVars:
      - key: PORT
        value: "8080"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_CONNECTION
        value: pgsql
      - key: CACHE_STORE
        value: file
      - key: SESSION_DRIVER
        value: array
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      # Random secrets generated by Render; copy them from the dashboard when
      # configuring cron-job.org and the operator health check.
      - key: SCHEDULER_SECRET
        generateValue: true
      - key: OPERATOR_HEALTH_SECRET
        generateValue: true
      # Entered by the operator in the dashboard (never committed).
      - key: APP_KEY
        sync: false
      # PostgreSQL connection URL from any host (Render, Supabase, Neon, …):
      # postgresql://user:password@host:5432/dbname?sslmode=require
      # No database is declared here on purpose: Render's free database is
      # deleted 44 days after creation.
      - key: DB_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
