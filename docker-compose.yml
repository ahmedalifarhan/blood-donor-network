# Local development only: PostgreSQL for the Laravel API (constitution V).
# Never used in production; Render gets its database through DB_URL.
#
#   docker compose up -d db        start PostgreSQL on 127.0.0.1:5432
#   docker compose down            stop it (data is kept in the "pgdata" volume)
#   docker compose down -v         stop it and delete all local data
#
# The credentials below are for this local container only. They are not secrets
# and must never be reused for a deployed database.
name: blood-donor-network

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: blood
      POSTGRES_PASSWORD: blood_local_only
      POSTGRES_DB: blood
    ports:
      # Bound to localhost only, so the database is not reachable from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the separate "blood_test" database used by the PostgreSQL test run.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blood -d blood"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
